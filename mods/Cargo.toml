# Mods für Zelda Core (jede Mod eine DLL). Bauen: `cargo build --release` in diesem Ordner,
# die DLLs liegen dann in `target/release`. Veröffentlicht werden sie im GitHub-Release „mods“ (Mod-Liste in der App).
[workspace]
resolver = "2"
members = [
    "enemy_hp",
    "speedrun",
    "info_hud",
    "slowmo",
    "hard_damage",
    "one_hit",
    "double_rupees",
    "heart_regen",
    "magic_regen",
    "day_night",
    "tunic_colors",
    "rainbow_enemies",
    "crown",
    "coin_sound",
    "full_supply",
    "fps_display",
    "clock",
    "coords",
    "death_counter",
    "session_timer",
    "health_display",
    "supply_display",
    "keystrokes",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
