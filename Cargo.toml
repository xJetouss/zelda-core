[package]
name = "zelda-core"
version = "0.53.0"
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "zelda-core"
description = "Spezialisierter SNES-Emulator nur fuer The Legend of Zelda: A Link to the Past (eigene ROM erforderlich)"

[dependencies]
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
glow = "0.14"
glutin = { version = "0.32", default-features = false, features = ["wgl"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
cpal = "0.15"
gilrs = "0.11"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
lz4_flex = "0.11"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
xbrz-rs = "0.1"

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2

# Eigene GPUI-Kopie mit kleinem Patch (Wiederverwendung großer Bild-Texturen unter Windows), siehe vendor/gpui/PASTLINK.md
[patch.crates-io]
gpui = { path = "vendor/gpui" }
